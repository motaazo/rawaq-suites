<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>دليل الضيف — أجنحة رواق</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Kufi+Arabic:wght@400;600&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>:root{--b:#0d0c0a;--s:#17140f;--g:#c9a45c;--gb:#eccd8c;--w:#faf8f2;--be:#ece3d0}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--be);font-family:"Noto Kufi Arabic",sans-serif}header{text-align:center;padding:38px 20px;border-bottom:1px solid #c9a45c44}h1{font:700 27px "Aref Ruqaa",serif;color:var(--w)}main{max-width:540px;margin:auto;padding:25px 18px 55px}.card{background:var(--s);border:1px solid #c9a45c44;border-radius:14px;padding:19px;margin:14px 0}.card h2{font:700 18px "Aref Ruqaa",serif;color:var(--gb)}.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}.value{color:var(--w);font-family:Poppins,"Noto Kufi Arabic",sans-serif;direction:ltr}.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--gb),var(--g));color:var(--b);font-weight:700;padding:13px;border-radius:10px;margin-top:12px}.state{text-align:center;padding:45px 15px;color:var(--gb)}</style></head>
<body><header><div>AJNIHAT RAWAQ</div><h1>دليل الضيف</h1></header><main id="content"><div class="state">جارٍ التحقق من صلاحية الوصول…</div></main>
<script>
/* Production contract:
 GET /api/guest/guide
 Requires a valid HttpOnly session created by /api/guest/access.
 Response example:
 {buildingName,mapUrl,mainDoorCode,floorNumber,unitNumber,entranceCode,
  apartmentNumber,unitDoorCode,wifiName,wifiPass,checkoutTime,whatsappUrl}
 Sensitive values live server-side only.
*/
(async()=>{
 const root=document.getElementById("content");
 try{
  const r=await fetch("/api/guest/guide",{credentials:"same-origin",cache:"no-store"});
  if(r.status===401||r.status===403){location.replace("rawaq-lock.html");return}
  if(!r.ok) throw new Error();
  const d=await r.json();
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  root.innerHTML=`
   <div class="card"><h2>الموقع</h2><div class="row"><span>المبنى</span><span>${esc(d.buildingName)}</span></div><a class="btn" href="${esc(d.mapUrl)}" target="_blank" rel="noopener">فتح الموقع على الخريطة</a></div>
   <div class="card"><h2>بيانات الوصول</h2><div class="row"><span>رمز الباب الرئيسي</span><span class="value">${esc(d.mainDoorCode)}</span></div><div class="row"><span>الدور</span><span>${esc(d.floorNumber)}</span></div><div class="row"><span>رقم الشقة</span><span>${esc(d.unitNumber)}</span></div><div class="row"><span>رمز مدخل أجنحة رواق</span><span class="value">${esc(d.entranceCode)}</span></div><div class="row"><span>باب الشقة</span><span class="value">${esc(d.unitDoorCode)}</span></div></div>
   <div class="card"><h2>الإنترنت (واي فاي)</h2><div class="row"><span>اسم الشبكة</span><span class="value">${esc(d.wifiName)}</span></div><div class="row"><span>كلمة المرور</span><span class="value">${esc(d.wifiPass)}</span></div></div>
   <div class="card"><h2>تسجيل الخروج</h2><div class="row"><span>وقت الخروج</span><span>${esc(d.checkoutTime)}</span></div><a class="btn" href="${esc(d.whatsappUrl)}" target="_blank" rel="noopener">تواصل مع المضيف</a></div>`;
 }catch(_){root.innerHTML='<div class="state">تعذر تحميل دليل الضيف. يرجى التواصل مع المضيف.</div>'}
})();
</script></body></html>
