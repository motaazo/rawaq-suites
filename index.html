<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أجنحة رواق — Ajnihat Rawaq</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ---------- الخطوط المخصصة ---------- */
    @font-face {
      font-family: "LosAngeles";
      src: url("fonts/LosAngeles.woff2") format("woff2"),
           url("fonts/LosAngeles.woff") format("woff");
      font-display: swap;
    }
    @font-face {
      font-family: "ModernKufi";
      src: url("fonts/ModernKufi.woff2") format("woff2"),
           url("fonts/ModernKufi.woff") format("woff");
      font-display: swap;
    }

    /* ---------- الهوية والألوان ---------- */
    :root {
      --black:      #0d0c0a;
      --black-soft: #17140f;
      --gold:       #c9a45c;
      --gold-bright:#eccd8c;
      --beige:      #ece3d0;
      --white:      #faf8f2;

      --font-ar-heading: "LosAngeles", "Aref Ruqaa", serif;
      --font-ar-body:    "ModernKufi", "Noto Kufi Arabic", sans-serif;
      --font-en-heading: "Poppins", sans-serif;
      --font-en-body:    "Inter", sans-serif;

      --ease: cubic-bezier(.16, .84, .44, 1);
    }

    /* ---------- التنسيقات العامة ---------- */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    html { 
      scroll-behavior: smooth; 
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-ar-body);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    html[lang="en"] body { 
      font-family: var(--font-en-body); 
    }

    h1, h2, h3, .heading { 
      font-family: var(--font-ar-heading); 
      font-weight: 700; 
      letter-spacing: .01em; 
    }
    html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] .heading {
      font-family: var(--font-en-heading); 
      letter-spacing: .02em;
    }

    img { 
      max-width: 100%; 
      display: block; 
    }

    @media (prefers-reduced-motion: reduce) {
      * { 
        animation-duration: .001ms !important; 
        transition-duration: .001ms !important; 
      }
    }

    /* ---------- زر تبديل اللغة ---------- */
    .lang-toggle {
      position: fixed;
      top: 18px;
      inset-inline-end: 18px;
      z-index: 60;
      display: flex;
      background: rgba(13, 12, 10, .55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 164, 92, .4);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
    }
    .lang-toggle button {
      border: none;
      background: transparent;
      color: var(--beige);
      font-family: var(--font-en-body);
      font-size: 12.5px;
      letter-spacing: .08em;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all .35s var(--ease);
    }
    .lang-toggle button.active {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: var(--black);
      font-weight: 600;
    }

    /* ---------- أيقونة القوس الشعار ---------- */
    .arch-frame {
      width: 78px; 
      height: 96px;
      margin: 0 auto 14px;
    }
    .arch-frame svg { 
      width: 100%; 
      height: 100%; 
    }

    /* ---------- القسم الرئيسي (Hero) ---------- */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 56px 20px 46px;
      background: 
        linear-gradient(180deg, rgba(13, 12, 10, .4) 0%, rgba(13, 12, 10, .7) 60%, var(--black) 100%),
        url('https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
      background-size: cover;
    }
    .hero-content {
      max-width: 600px;
      margin: 0 auto;
    }
    .brand-title {
      font-size: 32px;
      color: var(--white);
      margin-bottom: 8px;
    }
    .brand-sub {
      font-family: var(--font-en-heading);
      font-size: 14px;
      color: var(--gold-bright);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .hero-desc {
      font-size: 16px;
      color: var(--beige);
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- أزرار تغيير اللغة -->
  <div class="lang-toggle">
    <button class="active" onclick="setLang('ar')">AR</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <!-- واجهة الهيرو الرئيسية -->
  <section class="hero">
    <div class="hero-content">
      <div class="arch-frame">
        <svg viewBox="0 0 78 96" fill="none">
          <path d="M4 94V44C4 21 20 4 39 4C58 4 74 21 74 44V94" stroke="#c9a45c" stroke-width="2"/>
        </svg>
      </div>
      <h1 class="brand-title">أجنحة رواق</h1>
      <div class="brand-sub">Ajnihat Rawaq</div>
      <p class="hero-desc">مرحباً بكم في ملاذكم الفاخر، حيث تلتقي الأصالة بالراحة الفندقية الحديثة.</p>
    </div>
  </section>

  <!-- سكريبت التبديل الديناميكي للغات -->
  <script>
    function setLang(lang) {
      const html = document.documentElement;
      html.setAttribute('lang', lang);
      html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      
      document.querySelectorAll('.lang-toggle button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }
  </script>

</body>
</html>
