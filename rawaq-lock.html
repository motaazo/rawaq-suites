<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>دخول الضيف — أجنحة رواق</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--b:#0d0c0a;--s:#17140f;--g:#c9a45c;--gb:#eccd8c;--w:#faf8f2}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font-family:"Noto Kufi Arabic",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.box{width:min(390px,100%);background:var(--s);border:1px solid #c9a45c55;border-radius:18px;padding:34px;text-align:center}h1{font:700 27px "Aref Ruqaa",serif}p{color:#ece3d0;line-height:1.9;font-size:13px}input,button{width:100%;border-radius:10px;padding:15px;font:inherit}input{background:#0d0c0a;border:1px solid #c9a45c77;color:white;text-align:center;letter-spacing:.25em;font-size:20px}button{margin-top:12px;border:0;background:linear-gradient(135deg,var(--gb),var(--g));font-weight:700;cursor:pointer}.msg{min-height:24px;margin-top:10px;color:#e6a1a1;font-size:12px}</style></head>
<body><main class="box"><h1>أجنحة رواق</h1><p>أدخل رمز الوصول المرسل لك بعد تأكيد الحجز.</p>
<form id="accessForm"><input id="accessCode" name="code" type="password" inputmode="numeric" autocomplete="one-time-code" required aria-label="رمز الوصول"><button type="submit">دخول لدليل الضيف</button><div class="msg" id="msg" role="alert"></div></form></main>
<script>
/* Production contract:
 POST /api/guest/access  { code: "...." }
 Server validates the code, creates an HttpOnly + Secure + SameSite=Strict session cookie,
 and returns { ok:true, redirect:"/rawaq-guide.html" }.
 Never return/store the valid PIN in client code.
*/
const API_ENDPOINT="/api/guest/access";
document.getElementById("accessForm").addEventListener("submit",async(e)=>{
 e.preventDefault(); const msg=document.getElementById("msg"); msg.textContent="جارٍ التحقق…";
 try{
  const r=await fetch(API_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({code:document.getElementById("accessCode").value})});
  const data=await r.json().catch(()=>({}));
  if(r.ok&&data.ok&&data.redirect){location.assign(data.redirect);return}
  msg.textContent="تعذر التحقق من رمز الوصول.";
 }catch(_){msg.textContent="خدمة التحقق غير مفعلة بعد. يرجى التواصل مع المضيف."}
});
</script></body></html>
